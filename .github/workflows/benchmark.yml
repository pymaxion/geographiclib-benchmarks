name: Run Benchmarks

on:
  push:
    branches: [main, mainline]
  pull_request:
    branches: [main, mainline]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run benchmarks
        run: |
          docker build -t geographiclib-benchmarks .
          mkdir -p results
          docker run --rm -v ${{ github.workspace }}/results:/benchmark/results geographiclib-benchmarks | tee results/summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/*.json
            results/summary.txt

      - name: Update results badges
        if: github.ref == 'refs/heads/mainline' && github.event_name != 'pull_request'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Extract median times from results
          RUST_DIRECT=$(jq -r '.direct_ms' results/rust.json)
          CPP_DIRECT=$(jq -r '.direct_ms' results/cpp.json)
          JAVA_DIRECT=$(jq -r '.direct_ms' results/java.json)
          GO_DIRECT=$(jq -r '.direct_ms' results/go.json)
          RUST_INVERSE=$(jq -r '.inverse_ms' results/rust.json)
          CPP_INVERSE=$(jq -r '.inverse_ms' results/cpp.json)
          JAVA_INVERSE=$(jq -r '.inverse_ms' results/java.json)
          GO_INVERSE=$(jq -r '.inverse_ms' results/go.json)

          # Create shields.io endpoint JSON files for Direct
          echo '{"schemaVersion":1,"label":"Rust","message":"'"${RUST_DIRECT}"'ms","color":"#dea584"}' > /tmp/rust-direct.json
          echo '{"schemaVersion":1,"label":"C++","message":"'"${CPP_DIRECT}"'ms","color":"#f34b7d"}' > /tmp/cpp-direct.json
          echo '{"schemaVersion":1,"label":"Java","message":"'"${JAVA_DIRECT}"'ms","color":"#b07219"}' > /tmp/java-direct.json
          echo '{"schemaVersion":1,"label":"Go","message":"'"${GO_DIRECT}"'ms","color":"#00ADD8"}' > /tmp/go-direct.json

          # Create shields.io endpoint JSON files for Inverse
          echo '{"schemaVersion":1,"label":"Rust","message":"'"${RUST_INVERSE}"'ms","color":"#dea584"}' > /tmp/rust-inverse.json
          echo '{"schemaVersion":1,"label":"C++","message":"'"${CPP_INVERSE}"'ms","color":"#f34b7d"}' > /tmp/cpp-inverse.json
          echo '{"schemaVersion":1,"label":"Java","message":"'"${JAVA_INVERSE}"'ms","color":"#b07219"}' > /tmp/java-inverse.json
          echo '{"schemaVersion":1,"label":"Go","message":"'"${GO_INVERSE}"'ms","color":"#00ADD8"}' > /tmp/go-inverse.json

          # Update gist with all badge files
          GIST_ID="84e9bf15fe8b3994c6608d5c5d5344e7"
          jq -n \
            --arg rust_d "$(cat /tmp/rust-direct.json)" \
            --arg cpp_d "$(cat /tmp/cpp-direct.json)" \
            --arg java_d "$(cat /tmp/java-direct.json)" \
            --arg go_d "$(cat /tmp/go-direct.json)" \
            --arg rust_i "$(cat /tmp/rust-inverse.json)" \
            --arg cpp_i "$(cat /tmp/cpp-inverse.json)" \
            --arg java_i "$(cat /tmp/java-inverse.json)" \
            --arg go_i "$(cat /tmp/go-inverse.json)" \
            '{files: {
              "rust-direct.json": {content: $rust_d}, "cpp-direct.json": {content: $cpp_d},
              "java-direct.json": {content: $java_d}, "go-direct.json": {content: $go_d},
              "rust-inverse.json": {content: $rust_i}, "cpp-inverse.json": {content: $cpp_i},
              "java-inverse.json": {content: $java_i}, "go-inverse.json": {content: $go_i}
            }}' | \
          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @- \
            "https://api.github.com/gists/${GIST_ID}"
