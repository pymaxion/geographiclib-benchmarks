name: Run Benchmarks

on:
  push:
    branches: [main, mainline]
  pull_request:
    branches: [main, mainline]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run benchmarks
        run: |
          docker build -t geographiclib-benchmarks .
          mkdir -p results
          docker run --rm -v ${{ github.workspace }}/results:/benchmark/results geographiclib-benchmarks | tee results/summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/*.json
            results/summary.txt

      - name: Update results badges
        if: github.ref == 'refs/heads/mainline' && github.event_name != 'pull_request'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Extract median times from results
          RUST_MS=$(jq -r '.direct_ms' results/rust.json)
          CPP_MS=$(jq -r '.direct_ms' results/cpp.json)
          JAVA_MS=$(jq -r '.direct_ms' results/java.json)
          GO_MS=$(jq -r '.direct_ms' results/go.json)

          # Create shields.io endpoint JSON files
          cat > /tmp/rust.json << EOF
          {"schemaVersion":1,"label":"Rust","message":"${RUST_MS}ms","color":"#dea584"}
          EOF
          cat > /tmp/cpp.json << EOF
          {"schemaVersion":1,"label":"C++","message":"${CPP_MS}ms","color":"#f34b7d"}
          EOF
          cat > /tmp/java.json << EOF
          {"schemaVersion":1,"label":"Java","message":"${JAVA_MS}ms","color":"#b07219"}
          EOF
          cat > /tmp/go.json << EOF
          {"schemaVersion":1,"label":"Go","message":"${GO_MS}ms","color":"#00ADD8"}
          EOF

          # Update gist with all badge files
          GIST_ID="84e9bf15fe8b3994c6608d5c5d5344e7"
          jq -n \
            --arg rust "$(cat /tmp/rust.json)" \
            --arg cpp "$(cat /tmp/cpp.json)" \
            --arg java "$(cat /tmp/java.json)" \
            --arg go "$(cat /tmp/go.json)" \
            '{files: {"rust.json": {content: $rust}, "cpp.json": {content: $cpp}, "java.json": {content: $java}, "go.json": {content: $go}}}' | \
          curl -s -X PATCH \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @- \
            "https://api.github.com/gists/${GIST_ID}"
