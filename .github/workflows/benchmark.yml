name: Run Benchmarks

on:
  push:
    branches: [main, mainline]
  pull_request:
    branches: [main, mainline]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run benchmarks
        run: |
          docker build -t geographiclib-benchmarks .
          mkdir -p results
          docker run --rm -v ${{ github.workspace }}/results:/benchmark/results geographiclib-benchmarks | tee results/summary.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/*.json
            results/summary.txt
